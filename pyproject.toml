[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-claim-audit"
version = "0.1.0"
description = "Static audit of documented spoken capabilities"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
voice-claim-audit = "voice_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["voice_claim_audit*"]
